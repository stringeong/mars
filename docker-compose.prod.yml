services:
  server:
    environment:
      MARS_ENV: production
      MARS_SECRET_KEY: ${MARS_SECRET_KEY:?MARS_SECRET_KEY is required}
      MARS_ALLOWED_ORIGINS: ${MARS_ALLOWED_ORIGINS:?MARS_ALLOWED_ORIGINS is required}
      MARS_ALLOWED_HOSTS: ${MARS_ALLOWED_HOSTS:?MARS_ALLOWED_HOSTS is required}
    ports: !reset []
    expose:
      - "8000"

  web:
    ports: !override
      - "${MARS_HTTP_PORT:-80}:8080"
      - "${MARS_HTTPS_PORT:-443}:8443"
    volumes:
      - ./web/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./web/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ${MARS_TLS_CERT_FILE:?MARS_TLS_CERT_FILE is required}:/etc/nginx/tls/fullchain.pem:ro
      - ${MARS_TLS_KEY_FILE:?MARS_TLS_KEY_FILE is required}:/etc/nginx/tls/privkey.pem:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8443/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
